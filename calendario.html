<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calendario · Libros App</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2f6f4f">

  <!-- iOS: modo standalone a pantalla completa -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Libros">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="app-header">
    <h1>Calendario</h1>
    <p class="app-header-contador" id="contador-libros"></p>
    <nav class="app-nav">
      <a class="app-nav-link" href="index.html">Añadir</a>
      <a class="app-nav-link" href="historial.html">Historial</a>
      <a class="app-nav-link app-nav-link--activo" href="calendario.html">Calendario</a>
    </nav>
  </header>

  <main>
    <section class="card calendario-card">
      <button type="button" id="btn-volver-anio" class="btn-volver" hidden>← Volver al año</button>

      <div class="calendario-nav">
        <button type="button" id="nav-anterior" class="btn-mes" aria-label="Anterior">‹</button>
        <h2 id="calendario-titulo"></h2>
        <button type="button" id="nav-siguiente" class="btn-mes" aria-label="Siguiente">›</button>
      </div>

      <p id="total-periodo" class="total-periodo"></p>

      <div id="vista-anual" class="calendario-anual"></div>

      <div id="vista-mensual" hidden>
        <div class="calendario-dias-semana">
          <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
        </div>
        <div id="calendario-grid" class="calendario-grid"></div>
      </div>

      <div id="calendario-detalle" class="calendario-detalle" hidden></div>

      <div id="calendario-leyenda" class="calendario-leyenda"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="storage.js"></script>
  <script src="libros-utils.js"></script>
  <script src="calendario.js"></script>
</body>
</html>
