<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Libros App</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#243d2e">

  <!-- iOS: modo standalone a pantalla completa -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Libros">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="app-header">
    <h1>Mis Libros</h1>
    <p class="app-header-contador" id="contador-libros"></p>
  </header>

  <main>
    <section class="card">
      <h2>Añadir libro</h2>
      <form id="form-libro">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" name="titulo" required placeholder="Ej. Cien años de soledad">

        <label for="autor">Autor</label>
        <input type="text" id="autor" name="autor" required placeholder="Ej. Gabriel García Márquez">

        <label for="fechaFin">Fecha en la que lo terminaste</label>
        <input type="date" id="fechaFin" name="fechaFin" required>

        <label for="portada">Portada</label>
        <input type="file" id="portada" name="portada" accept="image/*" capture="environment">
        <img id="preview-portada" class="preview-portada" hidden alt="Vista previa de la portada">

        <button type="submit" class="btn-primary">Añadir libro</button>
      </form>
    </section>

    <section class="lista-section">
      <h2>Historial de lectura</h2>
      <ul id="lista-libros" class="lista-libros"></ul>
      <p id="lista-vacia" class="lista-vacia" hidden>Todavía no has añadido ningún libro.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
